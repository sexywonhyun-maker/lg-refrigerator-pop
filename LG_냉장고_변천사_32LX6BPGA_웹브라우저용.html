<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LG 냉장고 변천사 Experience POP</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f5f5;color:#171717;overflow:hidden}
button{font:inherit;border:0;cursor:pointer}
.app{width:100vw;height:100vh;display:flex;flex-direction:column;background:#fff}
.header{height:12vh;padding:2.2vh 4vw 1vh;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #ddd}
.kicker{font-size:1.5vw;letter-spacing:.12em;color:#666;font-weight:700}
.title{font-size:3.3vw;font-weight:800;line-height:1.05;margin-top:.6vh}
.subtitle{font-size:1.45vw;color:#666;margin-top:.8vh}
.step{font-size:1.35vw;color:#666}
.timeline{height:20vh;padding:2.2vh 4vw 1vh;display:flex;gap:1vw;align-items:stretch;background:#fafafa}
.stage{flex:1;background:#fff;border:1px solid #ddd;border-radius:18px;padding:1.5vh 1.2vw;text-align:left;transition:.2s;position:relative}
.stage.active{border:3px solid #111;transform:translateY(-2px)}
.stage .num{font-size:1vw;color:#777;font-weight:700}
.stage .name{font-size:1.55vw;font-weight:800;margin-top:1.2vh}
.stage .desc{font-size:1vw;color:#666;margin-top:.8vh;line-height:1.35}
.main{height:58vh;padding:2vh 4vw;display:flex;gap:2vw}
.visual{width:42%;border-radius:22px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.visual img{width:100%;height:100%;object-fit:contain}
.visual .badge{position:absolute;left:1.2vw;top:1.2vh;background:#111;color:#fff;border-radius:99px;padding:.8vh 1vw;font-size:1vw;font-weight:700}
.copy{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1vh 1vw}
.copy .eyebrow{font-size:1.15vw;color:#666;font-weight:700;letter-spacing:.08em}
.copy h2{font-size:3.2vw;line-height:1.15;margin:1.2vh 0}
.copy p{font-size:1.55vw;color:#555;line-height:1.55;margin:.6vh 0}
.tags{display:flex;gap:.6vw;margin-top:1.5vh;flex-wrap:wrap}
.tag{background:#f0f0f0;padding:.7vh .9vw;border-radius:99px;font-size:1vw}
.actions{display:flex;gap:.8vw;margin-top:2.2vh}
.action{background:#111;color:#fff;padding:1.3vh 1.3vw;border-radius:12px;font-size:1.2vw;font-weight:700}
.action.secondary{background:#eee;color:#111}
.challenge{margin-top:1.8vh;padding:1.5vh 1.2vw;background:#f7f7f7;border-radius:16px}
.challenge strong{font-size:1.25vw}
.challenge p{font-size:1vw;margin:.7vh 0;color:#555}
.footer{height:10vh;border-top:1px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:1.2vw;color:#555}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:5vh 7vw}
.modal.show{display:flex}
.modalbox{background:#fff;border-radius:24px;width:86vw;max-height:86vh;padding:4vh 4vw;overflow:auto}
.modal h2{font-size:3vw;margin:0 0 1vh}
.modal .lead{font-size:1.5vw;color:#444;line-height:1.5}
.choices{display:flex;gap:1.5vw;margin-top:2vh}
.choice{flex:1;padding:2vh 1.5vw;background:#f5f5f5;border:2px solid #ddd;border-radius:18px;font-size:1.25vw;font-weight:700}
.choice:hover{border-color:#111}
.result{margin-top:2vh;padding:2vh;background:#111;color:#fff;border-radius:18px;display:none}
.close{float:right;background:#eee;border-radius:50%;width:42px;height:42px;font-size:24px}
@media(max-width:900px){
 .kicker,.step{font-size:12px} .title{font-size:28px} .subtitle{font-size:14px}
 .timeline{height:23vh;overflow-x:auto} .stage{min-width:150px} .stage .name{font-size:17px} .stage .desc{font-size:12px}
 .main{height:55vh} .copy h2{font-size:28px} .copy p{font-size:15px}
 .visual{width:40%} .action{font-size:13px}
}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div>
    <div class="kicker">LG REFRIGERATOR EXPERIENCE POP</div>
    <div class="title">냉장고, 어디까지 진화했을까요?</div>
    <div class="subtitle">더 많이 보관하는 냉장고에서 · 더 편하게 사용하는 냉장고로</div>
  </div>
  <div class="step" id="step">STEP 01 / 05</div>
</header>

<section class="timeline" id="timeline"></section>

<main class="main">
  <div class="visual" id="visual"></div>
  <div class="copy">
    <div class="eyebrow" id="eyebrow"></div>
    <h2 id="headline"></h2>
    <p id="body"></p>
    <div class="tags" id="tags"></div>
    <div class="actions">
      <button class="action secondary" onclick="prev()">‹ 이전</button>
      <button class="action" onclick="next()">다음 진화 보기 ›</button>
      <button class="action" onclick="openChallenge()">🎯 냉동고 보물찾기</button>
    </div>
    <div class="challenge">
      <strong>매장 활용 TIP</strong>
      <p>고객에게 먼저 설명하기보다, 직접 눌러보고 비교한 뒤 “어느 쪽이 더 편하셨어요?”라고 질문해 보세요.</p>
    </div>
  </div>
</main>

<footer class="footer">직접 찾아보고 · 직접 느껴보고 · 우리 집에 맞는 냉장고를 찾아보세요.</footer>
</div>

<div class="modal" id="modal">
 <div class="modalbox">
  <button class="close" onclick="closeChallenge()">×</button>
  <h2>🔎 냉동고 보물찾기</h2>
  <div class="lead">두 구조에서 같은 위치의 식재료를 찾아본다고 생각해 보세요.<br><b>어느 쪽에서 더 쉽게 찾을 수 있을까요?</b></div>
  <div class="choices">
   <button class="choice" onclick="answer('일반적인 상냉장·하냉동 구조')">① 상냉장 · 하냉동</button>
   <button class="choice" onclick="answer('드로어 구조')">② 드로어</button>
  </div>
  <div class="result" id="result"></div>
 </div>
</div>

const data = [
 {name:"일반형", short:"많이 보관하기", desc:"한 공간에 식재료를 담아 보관하는 기본적인 냉장고"},
 {name:"양문형", short:"더 크게 보관하기", desc:"냉장·냉동 공간을 나누고 수납 공간을 넓혀가기 시작"},
 {name:"상냉장 · 하냉동", short:"자주 쓰는 공간을 편하게", desc:"냉장 공간을 눈높이에 두고 냉동 공간을 아래로 배치"},
 {name:"4도어", short:"공간을 나눠 효율적으로", desc:"식재료와 사용 목적에 따라 공간을 더욱 세분화"},
 {name:"드로어", short:"더 편하게 찾고, 내 생활에 맞게", desc:"냉동실을 앞으로 가져오고, 가운데 공간을 생활에 맞게 활용"}
];

function renderTimeline(){
 const t=document.getElementById("timeline");
 t.innerHTML=data.map((d,i)=>`<button class="stage ${i===current?'active':''}" onclick="go(${i})">
 <div class="num">STEP ${String(i+1).padStart(2,'0')}</div>
 <div class="name">${d.name}</div><div class="desc">${d.short}</div></button>`).join("");
}
let current=0;
function render(){
 const d=data[current];
 document.getElementById("step").textContent=`STEP ${String(current+1).padStart(2,'0')} / 05`;
 document.getElementById("eyebrow").textContent=`STEP ${String(current+1).padStart(2,'0')} · ${d.name}`;
 document.getElementById("headline").textContent=d.short;
 document.getElementById("body").textContent=d.desc;
 document.getElementById("tags").innerHTML=current===4
 ? '<span class="tag">앞으로 꺼내는 냉동실</span><span class="tag">가변형 중칸</span><span class="tag">라이프스타일 맞춤</span>'
 : '<span class="tag">냉장고의 진화</span><span class="tag">사용 편의</span>';
 const v=document.getElementById("visual");
 if(current===4){
   v.innerHTML=`<div class="badge">사용자 제공 실제 제품 사진</div><img src="${drawerPhoto}" alt="드로어 냉장고">`;
 } else {
   const labels=["기본 수납","좌우 분리","상냉장·하냉동","공간 세분화"];
   v.innerHTML=`<div style="text-align:center;color:#555">
    <div style="font-size:7vw;line-height:1">▯</div>
    <div style="font-size:1.5vw;font-weight:800">${labels[current]}</div>
    <div style="font-size:1vw;margin-top:1vh">STEP ${String(current+1).padStart(2,'0')}</div>
   </div>`;
 }
 renderTimeline();
}
function go(i){current=i;render()}
function next(){current=(current+1)%5;render()}
function prev(){current=(current+4)%5;render()}
function openChallenge(){document.getElementById("modal").classList.add("show");document.getElementById("result").style.display="none"}
function closeChallenge(){document.getElementById("modal").classList.remove("show")}
function answer(choice){
 const r=document.getElementById("result");
 r.style.display="block";
 r.innerHTML=`선택하신 구조: <b>${choice}</b><br><br>
 <span style="font-size:1.45vw"><b>드로어의 핵심은 “더 큰 냉동실”보다 “더 쉽게 찾는 냉동실”입니다.</b></span><br>
 냉동실에 몸을 숙여 들어가는 것이 아니라, 냉동실을 내 앞으로 가져오는 방식입니다.`;
}
render();
